<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Pult. — Lehrerhelfer: Notenverwaltung, Stundenplan, Todos und Termine. Läuft komplett lokal im Browser.">
  <meta name="theme-color" content="#16514b">

  <!-- Installierbare Web-App (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">

  <!-- iOS „Zum Home-Bildschirm" -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pult.">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <title>Pult.</title>
  <link rel="stylesheet" href="css/pult.css">
</head>
<body>

  <header class="topbar">
    <div class="brand" id="navHome">
      <span class="brand-mark">Pult<span class="dot">.</span></span>
    </div>
    <nav class="crumbs" id="crumbs"></nav>
    <div class="topbar-right" id="topbarRight"></div>
  </header>

  <main id="app"></main>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle">Titel</h2>
        <button class="icon-btn" id="modalClose" aria-label="Schließen">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

  <script src="js/pult.js"></script>
  <script>
    /* Service Worker registrieren (nur über http/https, nicht bei file://) */
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
